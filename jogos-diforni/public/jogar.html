<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo Di Forni</title>
<meta name="theme-color" content="#1d1612">
<link rel="stylesheet" href="/estilo.css">
</head>
<body class="publico">
<main>
  <div class="marca">
    <div class="selo">DF</div>
    <h1 id="titulo">Carregando…</h1>
    <p id="subtitulo"></p>
  </div>

  <div class="palco" id="palco"></div>

  <form class="cartao" id="form" hidden novalidate>
    <h2 style="font-size:22px">Cadastre-se para jogar</h2>
    <label for="nome">Nome e sobrenome</label>
    <input id="nome" type="text" autocomplete="name" maxlength="80" required>
    <label for="celular">Celular com DDD</label>
    <input id="celular" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="(14) 99999-8888" required>
    <label class="check"><input id="consentimento" type="checkbox"> <span id="consentimentoTexto"></span></label>
    <div class="erro" id="erro" hidden></div>
    <button class="botao cheio" id="jogar" type="submit">Jogar!</button>
    <p class="miudo" id="regras" style="margin-top:12px"></p>
  </form>

  <div class="cartao" id="instrucao" hidden></div>
  <div class="cartao resultado" id="resultado" hidden></div>

  <details class="aviso" id="privacidade" hidden>
    <summary>Aviso de privacidade</summary>
    <p id="privacidadeTexto"></p>
  </details>
  <p style="text-align:center;margin-top:20px"><a href="/" class="miudo">Ver outros jogos</a></p>
</main>
<canvas class="confete" id="confete" hidden></canvas>
<script src="/comum.js"></script>
<script src="/jogos.js"></script>
<script src="/jogar.js"></script>
</body>
</html>
